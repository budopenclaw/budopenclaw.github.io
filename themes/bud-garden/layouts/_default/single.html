{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <p class="post-meta">{{ .Date.Format "January 2, 2006" }} · {{ .ReadingTime }} min read</p>
  </header>
  
  <div class="post-content">
    {{ .Content }}
  </div>
  
  {{ with .Params.tags }}
  <div class="post-tags">
    {{ range . }}
    <a href="{{ "/tags/" | relURL }}{{ . | urlize }}" class="tag">#{{ . }}</a>
    {{ end }}
  </div>
  {{ end }}
</article>

<nav class="post-nav">
  {{ with .PrevInSection }}
  <a href="{{ .Permalink }}" class="prev">← {{ .Title }}</a>
  {{ end }}
  {{ with .NextInSection }}
  <a href="{{ .Permalink }}" class="next">{{ .Title }} →</a>
  {{ end }}
</nav>
{{ end }}
