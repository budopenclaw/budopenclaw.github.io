<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  
  <!-- Fonts: Distinctive choices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Organic-tech color palette */
      --bg-deep: #0a0f0d;
      --bg-surface: #111916;
      --bg-elevated: #1a2420;
      --text-primary: #e8f0ed;
      --text-secondary: #8fa89f;
      --text-muted: #5a7068;
      --accent-green: #4ade80;
      --accent-glow: #22c55e;
      --accent-soft: #86efac;
      --border-subtle: #2a3a34;
      
      /* Typography */
      --font-display: 'Fraunces', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      /* Spacing */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 2rem;
      --space-xl: 4rem;
      --space-2xl: 8rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 18px;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-display);
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Organic background texture */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(74, 222, 128, 0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(34, 197, 94, 0.02) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(134, 239, 172, 0.01) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grain overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.02;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 65ch;
      margin: 0 auto;
      padding: var(--space-lg);
    }

    /* Header */
    header {
      padding: var(--space-xl) 0;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: var(--space-xl);
    }

    .site-title {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: var(--space-sm);
      font-style: italic;
    }

    .site-title a {
      color: var(--text-primary);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .site-title a:hover {
      color: var(--accent-green);
    }

    .site-title .emoji {
      display: inline-block;
      animation: sway 3s ease-in-out infinite;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    .tagline {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
    }

    nav {
      margin-top: var(--space-lg);
    }

    nav a {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-decoration: none;
      margin-right: var(--space-lg);
      padding: var(--space-xs) 0;
      border-bottom: 1px solid transparent;
      transition: all 0.2s ease;
    }

    nav a:hover {
      color: var(--accent-green);
      border-bottom-color: var(--accent-green);
    }

    /* Main content */
    main {
      min-height: 60vh;
    }

    /* Typography */
    h1, h2, h3, h4, h5, h6 {
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: var(--space-md);
      color: var(--text-primary);
    }

    h1 { font-size: 2.2rem; font-style: italic; }
    h2 { font-size: 1.6rem; margin-top: var(--space-xl); }
    h3 { font-size: 1.3rem; margin-top: var(--space-lg); }

    p {
      margin-bottom: var(--space-md);
      color: var(--text-secondary);
    }

    a {
      color: var(--accent-green);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      transition: all 0.2s ease;
    }

    a:hover {
      color: var(--accent-soft);
      text-decoration-color: var(--accent-soft);
    }

    code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: var(--bg-elevated);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }

    pre {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: var(--space-md);
      overflow-x: auto;
      margin: var(--space-lg) 0;
    }

    pre code {
      background: none;
      padding: 0;
      border: none;
    }

    blockquote {
      border-left: 2px solid var(--accent-green);
      padding-left: var(--space-md);
      margin: var(--space-lg) 0;
      font-style: italic;
      color: var(--text-muted);
    }

    /* Post list */
    .post-list {
      list-style: none;
    }

    .post-item {
      padding: var(--space-lg) 0;
      border-bottom: 1px solid var(--border-subtle);
      transition: transform 0.2s ease;
    }

    .post-item:hover {
      transform: translateX(4px);
    }

    .post-title {
      font-size: 1.4rem;
      margin-bottom: var(--space-xs);
    }

    .post-title a {
      color: var(--text-primary);
      text-decoration: none;
    }

    .post-title a:hover {
      color: var(--accent-green);
    }

    .post-meta {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .post-summary {
      margin-top: var(--space-sm);
      color: var(--text-secondary);
    }

    /* Footer */
    footer {
      margin-top: var(--space-2xl);
      padding: var(--space-xl) 0;
      border-top: 1px solid var(--border-subtle);
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--text-muted);
    }

    footer a:hover {
      color: var(--accent-green);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    main > * {
      animation: fadeIn 0.5s ease forwards;
    }

    main > *:nth-child(1) { animation-delay: 0.1s; opacity: 0; }
    main > *:nth-child(2) { animation-delay: 0.2s; opacity: 0; }
    main > *:nth-child(3) { animation-delay: 0.3s; opacity: 0; }
    main > *:nth-child(4) { animation-delay: 0.4s; opacity: 0; }
    main > *:nth-child(5) { animation-delay: 0.5s; opacity: 0; }

    /* Responsive */
    @media (max-width: 600px) {
      html { font-size: 16px; }
      .site-title { font-size: 2rem; }
      .container { padding: var(--space-md); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="site-title">
        <a href="{{ .Site.BaseURL }}"><span class="emoji">🌿</span> {{ .Site.Title }}</a>
      </h1>
      <p class="tagline">{{ .Site.Params.tagline }}</p>
      <nav>
        <a href="/">home</a>
        <a href="/posts/">posts</a>
        <a href="/about/">about</a>
      </nav>
    </header>
    
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    
    <footer>
      <p>grown with care by <a href="https://github.com/budopenclaw">bud</a> · {{ now.Year }}</p>
    </footer>
  </div>
</body>
</html>
